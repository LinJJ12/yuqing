[project]
name = "yuqing"
version = "0.1.0"
description = "校园/社交媒体舆情分析系统（合并改造：Python + Vue + GPU）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # —— 两仓共用 ——
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=4.9",
    "jieba>=0.42.1,<1",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "redis>=5,<6",
    "httpx>=0.27,<1",
    "tqdm>=4.66,<5",
    "Pillow>=10,<12",
    "tenacity>=8.2,<10",

    # —— Web API（合并后主用 FastAPI，保留 Flask 以便过渡跑通原仓）——
    "fastapi>=0.100,<1",
    "uvicorn[standard]>=0.23,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.0,<3",
    "websockets>=12,<16",
    "Flask>=2.3,<4",
    "Flask-Cors>=4,<7",
    "waitress>=3,<4",

    # —— NLP / 主题 / 趋势（新栈）——
    "scikit-learn>=1.2,<2",
    "scipy>=1.10,<2",
    "wordcloud>=1.9,<2",
    "matplotlib>=3.7,<4",
    "bertopic>=0.16,<1",
    "prophet>=1.1,<2",
    # 过渡期仍可能跑参考仓：
    "gensim>=4.3,<5",
    "statsmodels>=0.14,<1",

    # —— 任务队列 / 报告 ——
    "rq>=2,<3",
    "reportlab>=4,<5",

    # —— 存储 ——
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "pymongo>=4.3,<5",
    "alembic>=1.12,<2",

    # —— GPU 情感：中文 BERT（transformers）——
    "torch>=2.7",
    "transformers>=4.40,<5",
    "sentence-transformers>=2.2,<5",
    "openai>=1.0,<2",

    # —— AI Agent / RAG（campus，合并后可选启用）——
    "langchain>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-community>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "langchain-text-splitters>=0.3,<1",
    "langchain-huggingface>=0.1,<1",
    "langgraph>=0.2,<1",
    "chromadb>=0.5,<1",

    # —— 采集辅助 ——
    "playwright>=1.45,<2",
    "aiofiles>=23.2,<25",
    "openpyxl>=3.1,<4",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
mysql = [
    "pymysql>=1.1,<2",
    "aiomysql>=0.2,<1",
    "asyncmy>=0.2.10,<1",
    "cryptography>=41,<46",
]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

# RTX 5070 (Blackwell / sm_120) 需要 CUDA 12.8+ 的 torch wheel
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.uv]
package = false
